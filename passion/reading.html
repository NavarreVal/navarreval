<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://navarreval.com/passion/reading">
  <link rel="icon" href="/favicon.ico?v=3" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=3">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
  <title>Reading | J. Navarre Valdivieso</title>
  <link rel="stylesheet" href="../css/style.css?v=3.3">
  <style>
    html, body {
      background: #0d0d0d;
      overflow-x: hidden;
      overflow-y: auto;
      min-height: 100vh;
    }
    .read-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.2rem 1.5rem 4rem;
    }
    .read-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2.4rem;
      gap: 1rem;
    }
    .read-top h1 {
      font-size: 1.15rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #f0f0f0;
      font-weight: 500;
      margin: 0;
    }
    .read-top .stub-back,
    .read-footer .stub-back { text-decoration: none; margin-bottom: 0; }
    .shelf { margin-bottom: 3rem; }
    .shelf h2 {
      font-size: 0.82rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1.1rem;
      font-weight: 600;
    }
    .shelf-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 1.4rem 1rem;
    }
    .book {
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    .book-cover-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3;
    }
    .book-cover-frame > .book-placeholder,
    .book-cover-frame > img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      aspect-ratio: auto;
      border: 1px solid #2a2a2a;
    }
    .book-cover-frame > img {
      object-fit: cover;
      background: transparent;
      z-index: 1;
    }
    .book-placeholder {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 0.4rem;
      overflow: hidden;
      padding: 0.9rem 0.7rem 0.75rem 1.05rem;
      border-color: var(--cover-edge, #54485d);
      background: var(--cover, #3a3240);
      color: #f4f1ea;
    }
    .book-placeholder::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 8px;
      background: linear-gradient(
        90deg,
        var(--cover-spine, #241f28) 0%,
        var(--cover-spine-light, #54485d) 48%,
        var(--cover-spine, #241f28) 100%
      );
    }
    /* Deep book-cloth colors. Title and author text stay at WCAG AA on each. */
    .book-placeholder[data-cover="0"] { /* plum */
      --cover: #4a3450;
      --cover-spine: #2e2032;
      --cover-spine-light: #6b4b74;
      --cover-edge: #6b4b74;
    }
    .book-placeholder[data-cover="1"] { /* dark evergreen */
      --cover: #1c3a2c;
      --cover-spine: #11241b;
      --cover-spine-light: #295440;
      --cover-edge: #295440;
    }
    .book-placeholder[data-cover="2"] { /* olive drab */
      --cover: #45462e;
      --cover-spine: #2b2b1d;
      --cover-spine-light: #646643;
      --cover-edge: #646643;
    }
    .book-placeholder[data-cover="3"] { /* oxblood */
      --cover: #5c2c30;
      --cover-spine: #391b1e;
      --cover-spine-light: #854046;
      --cover-edge: #854046;
    }
    .book-placeholder[data-cover="4"] { /* slate navy */
      --cover: #2a3a4c;
      --cover-spine: #1a242f;
      --cover-spine-light: #3d546e;
      --cover-edge: #3d546e;
    }
    .book-placeholder[data-cover="5"] { /* deep teal */
      --cover: #1c4044;
      --cover-spine: #11282a;
      --cover-spine-light: #295d63;
      --cover-edge: #295d63;
    }
    .book-placeholder[data-cover="6"] { /* umber */
      --cover: #4a3826;
      --cover-spine: #2e2318;
      --cover-spine-light: #6b5137;
      --cover-edge: #6b5137;
    }
    .book-placeholder[data-cover="7"] { /* charcoal plum */
      --cover: #3a3240;
      --cover-spine: #241f28;
      --cover-spine-light: #54485d;
      --cover-edge: #54485d;
    }
    .book-placeholder[data-cover="8"] { /* dusty burgundy */
      --cover: #5a343c;
      --cover-spine: #382025;
      --cover-spine-light: #824b57;
      --cover-edge: #824b57;
    }
    .book-placeholder[data-cover="9"] { /* moss */
      --cover: #314428;
      --cover-spine: #1e2a19;
      --cover-spine-light: #47633a;
      --cover-edge: #47633a;
    }
    .book-placeholder-title,
    .book-placeholder-author {
      margin: 0;
      min-height: 0;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
    }
    .book-placeholder-title {
      font: 600 0.78rem/1.25 inherit;
      color: #f4f1ea;
      -webkit-line-clamp: 4;
      line-clamp: 4;
    }
    .book-placeholder-author {
      position: relative;
      padding-top: 0.45rem;
      font: 500 0.68rem/1.3 inherit;
      color: #e4d7c2;
      -webkit-line-clamp: 2;
      line-clamp: 2;
    }
    .book-placeholder-author:empty {
      display: none;
    }
    .book-placeholder-author::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 2.1rem;
      height: 2px;
      background: var(--cover-spine-light, #54485d);
    }
    .book strong {
      font-size: 0.84rem;
      color: #eee;
      line-height: 1.3;
      font-weight: 600;
    }
    .book span {
      font-size: 0.75rem;
      color: #888;
      line-height: 1.35;
    }
    .shelf-status { color: #777; font-size: 0.9rem; }
    .read-note {
      max-width: 560px;
      margin: 2rem auto 0;
      text-align: center;
      font-size: 0.88rem;
      line-height: 1.6;
      color: #8a8a8a;
    }
    .read-note a { color: var(--gold); }
    .read-footer {
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 2.2rem 0 0.4rem;
    }
    .shelf {
      margin-bottom: 0;
      padding: 1.6rem 0 2.2rem;
      border-top: 1px solid #2a2a2a;
    }

    .shelf:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .shelf h2 {
      font-size: 1.15rem;
      letter-spacing: 0.14em;
      margin-bottom: 1.3rem;
    }
    .shelf {
      margin-bottom: 0;
      padding: 1.6rem 1.2rem 2.2rem;
      border-top: 1px solid #2a2a2a;
      border-radius: 10px;
      border-top-color: #4a3828;
    }

    .shelf:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .shelf:nth-of-type(odd) {
      background: #14100c;
    }

    .shelf:nth-of-type(even) {
      background: #1c1610;
    }
    
  </style>
  <link rel="stylesheet" href="/css/dossier.css?v=1.20">
</head>
<body>
  <script src="/js/dossier-chrome.js?v=4"></script>
  <div class="read-page" id="top">
    <div class="read-top">
      <h1>Reading</h1>
      <span></span>
    </div>

    <section class="shelf" data-shelf="currently-reading" data-count="10">
        <h2>Currently reading</h2>
        <p class="shelf-status">Loading…</p>
        <div class="shelf-grid"></div>
      </section>
  
      <section class="shelf" data-shelf="read" data-count="24">
        <h2>Recently read</h2>
        <p class="shelf-status">Loading…</p>
        <div class="shelf-grid"></div>
      </section>
  
      <section class="shelf" data-shelf="favorites" data-count="20">
        <h2>Favorites</h2>
        <p class="shelf-status">Loading…</p>
        <div class="shelf-grid"></div>
      </section>

    <p class="read-note">
      These shelves come from an export of my
      <a href="https://www.goodreads.com/user/show/12968726-navarre-valdivieso" target="_blank" rel="noopener">Goodreads</a>
      library and are updated from time to time.
    </p>

    <div class="read-footer">
      <a class="back-btn stub-back" href="#top">↑ Top</a>
    </div>
  </div>

  <script type="module">
    import { startReadingShelves } from "/js/reading-shelves.js?v=5";
    startReadingShelves();
  </script>
  <script>
    document.documentElement.classList.add("page-slide");
    document.body.classList.add("page-enter");
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        document.body.classList.add("page-enter-active");
      });
    });
  </script>
 
  <footer class="legal-footer" style="text-align:center;font-size:0.75rem;line-height:1.5;opacity:0.75;padding:1.5rem 1rem 2rem;margin:0;"><a href="/privacy">Privacy</a> · <a href="/copyright">Copyright</a></footer>
</body>
</html>
