<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Games | J. Navarre Valdivieso</title>
  <link rel="stylesheet" href="../css/style.css?v=3.3">
  <style>
    :root { --gold: #c9a227; }
    html, body {
      background: #0d0d0d;
      overflow-x: hidden;
      overflow-y: auto;
      min-height: 100vh;
    }
    .games-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.2rem 1.5rem 4rem;
    }
    .games-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.6rem;
      gap: 1rem;
    }
    .games-top h1 {
      font-size: 1.15rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #f0f0f0;
      font-weight: 500;
      margin: 0;
    }
    .games-top .stub-back,
    .games-footer .stub-back { text-decoration: none; margin-bottom: 0; }
    .games-lead {
      max-width: 42rem;
      margin: 0 0 2rem;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #b0b0b0;
    }
    .shelf {
      margin-bottom: 0;
      padding: 1.6rem 1.2rem 2.2rem;
      border-top: 1px solid #2a3d4a;
      border-radius: 10px;
    }
    .shelf:first-of-type {
      border-top: 0;
      padding-top: 1.6rem;
    }
    .shelf:nth-of-type(odd) { background: #0e1218; }
    .shelf:nth-of-type(even) { background: #141a22; }
    .shelf h2 {
      font-size: 1.15rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1.3rem;
      font-weight: 600;
    }
    .shelf-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.4rem 1rem;
      justify-items: start;
    }
    .game {
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      max-width: 231px;
    }
    .game img {
      width: 100%;
      aspect-ratio: 231 / 87;
      object-fit: cover;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      display: block;
    }
    .game:hover img {
      border-color: #4a6a7a;
    }
    .game strong {
      font-size: 0.84rem;
      color: #eee;
      line-height: 1.3;
      font-weight: 600;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .game span {
      font-size: 0.75rem;
      color: #888;
      line-height: 1.35;
    }
    .shelf-status { color: #777; font-size: 0.9rem; }
    .shelf-status a { color: var(--gold); }
    .games-note {
      max-width: 560px;
      margin: 2rem auto 0;
      text-align: center;
      font-size: 0.88rem;
      line-height: 1.6;
      color: #8a8a8a;
    }
    .games-note a { color: var(--gold); }
    .games-footer {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 2.2rem 0 0.4rem;
    }
    @media (max-width: 480px) {
      .shelf-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="games-page" id="top">
    <div class="games-top">
      <a class="back-btn stub-back" href="/#passion">← Return</a>
      <h1>Video Games</h1>
      <span></span>
    </div>

    <p class="games-lead">
      A look at what I’ve been playing lately, and the games that have taken the most time over the years.
    </p>

    <section class="shelf" data-shelf="recent" data-count="12">
      <h2>Recently played</h2>
      <p class="shelf-status">Loading…</p>
      <div class="shelf-grid"></div>
    </section>

    <section class="shelf" data-shelf="most-played" data-count="24">
      <h2>Most played</h2>
      <p class="shelf-status">Loading…</p>
      <div class="shelf-grid"></div>
    </section>

    <p class="games-note">
      Hours come from
      <a href="https://steamcommunity.com/id/NavarreVal/" target="_blank" rel="noopener">Steam</a>
      and can lag behind what’s on my profile.
    </p>

    <div class="games-footer">
      <a class="back-btn stub-back" href="/#passion">← Return</a>
      <a class="back-btn stub-back" href="https://steamcommunity.com/id/NavarreVal/" target="_blank" rel="noopener">Steam profile</a>
      <a class="back-btn stub-back" href="#top">↑ Top</a>
    </div>
  </div>

  <script>
    const PROFILE = "https://steamcommunity.com/id/NavarreVal/";
    const WORKER = "https://steam-shelves.navarreval.workers.dev";

    function hoursLabel(minutes) {
      const h = Math.round(Number(minutes) / 60) || 0;
      if (h < 1) return "< 1 hr";
      return h.toLocaleString() + (h === 1 ? " hr" : " hrs");
    }

    async function loadShelf(section) {
      const shelf = section.dataset.shelf;
      const count = section.dataset.count || 20;
      const status = section.querySelector(".shelf-status");
      const grid = section.querySelector(".shelf-grid");
      const feed = WORKER + "?shelf=" + encodeURIComponent(shelf) + "&count=" + count;

      try {
        const res = await fetch(feed);
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        const games = Array.isArray(data.games) ? data.games : [];
        status.remove();
        if (!games.length) {
          section.insertAdjacentHTML(
            "beforeend",
            '<p class="shelf-status">Nothing on this shelf right now. <a href="' +
              PROFILE + '" target="_blank" rel="noopener">Open on Steam</a>.</p>'
          );
          return;
        }
        games.forEach(function (game) {
          const a = document.createElement("a");
          a.className = "game";
          a.href = game.store || game.community || PROFILE;
          a.target = "_blank";
          a.rel = "noopener";

          const img = document.createElement("img");
          img.src = game.img || "";
          img.alt = game.name || "";
          img.loading = "lazy";

          const strong = document.createElement("strong");
          strong.textContent = game.name || "Untitled";

          const meta = document.createElement("span");
          meta.textContent = hoursLabel(game.playtime_forever);

          a.append(img, strong, meta);
          grid.appendChild(a);
        });
      } catch (err) {
        status.innerHTML =
          'Could not load this shelf. <a href="' + PROFILE +
          '" target="_blank" rel="noopener">Open on Steam</a>.';
      }
    }

    document.querySelectorAll(".shelf").forEach(loadShelf);

    document.documentElement.classList.add("page-slide");
    document.body.classList.add("page-enter");
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        document.body.classList.add("page-enter-active");
      });
    });
  </script>
</body>
</html>
