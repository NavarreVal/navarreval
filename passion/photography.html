<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://navarreval.com/passion/photography">
  <link rel="icon" href="/favicon.ico?v=3" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=3">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
  <title>Photography | J. Navarre Valdivieso</title>
  <link rel="stylesheet" href="../css/style.css?v=3.2">
  <style>
    html, body {
      background: #fff;
      color: #2c2c2c;
      overflow-x: hidden;
      overflow-y: auto;
      min-height: 100vh;
    }
    .photo-page {
      position: relative;
      min-height: 100vh;
      padding: 2.2rem 0 0;
      background: #fff;
    }
    .photo-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      width: 100%;
      box-sizing: border-box;
      padding: 0 1.5rem;
      margin: 0 auto 1.25rem;
      column-gap: 1rem;
    }
    .photo-top h1 {
      justify-self: center;
      text-align: center;
      font-size: 1.15rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #2c2c2c;
      font-weight: 500;
      margin: 0;
    }
    .photo-top .stub-back {
      justify-self: start;
      margin-bottom: 0;
    }
    .photo-wall {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0;
      max-width: none;
      margin: 0;
      width: 100%;
    }

    .photo-top .stub-back,
    .photo-footer .stub-back {
      text-decoration: none;
    }

    .photo-wall button {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #111;
      border: 0;
      padding: 0;
      cursor: zoom-in;
      overflow: hidden;
    }

    .photo-wall picture {
      display: block;
      width: 100%;
      height: 100%;
    }

    .photo-wall img {
      display: block;
      width: 100%;
      height: 100%;
      max-height: none;
      object-fit: cover;
      object-position: center;
      margin: 0;
      transition: transform 0.35s ease, opacity 0.25s ease;
    }

    .photo-wall button:hover img {
      opacity: 1;
      transform: scale(1.03);
    }

    .photo-signature {
      display: block;
      width: 180px;
      height: auto;
      margin: 2.8rem auto 1.1rem;
    }

    .photo-signature {
      mix-blend-mode: normal;
      filter: none;
    }

    .photo-note {
      max-width: 41rem;
      margin: 0 auto 2rem;
      padding: 0 1.5rem;
      text-align: center;
      font-size: 1.02rem;
      line-height: 1.72;
      color: #3d3d3d;
    }

    .photo-footer {
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 2.4rem 1.5rem 2.8rem;
    }

    .photo-footer .stub-back {
      margin-bottom: 0;
      color: #2c2c2c;
      border-color: #c8c2b6;
      background: #fff;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
    }

    @media (max-width: 900px) {
      .photo-wall {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .photo-wall img { max-height: none; }
    }

    @media (max-width: 520px) {
      .photo-wall {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 430px) {
      .photo-top {
        grid-template-columns: 1fr;
        row-gap: 0.7rem;
      }
      .photo-top h1 {
        grid-row: 1;
      }
      .photo-top .stub-back {
        grid-row: 2;
      }
      .photo-top > span {
        display: none;
      }
    }
  </style>
  <link rel="stylesheet" href="/css/dossier.css?v=1.20">
</head>
<body>
  <script src="/js/dossier-chrome.js?v=4"></script>
   <div class="photo-page" id="top">
    <div class="photo-top">
      <span></span>
      <h1>Photography</h1>
      <span></span>
    </div>
    <p class="photo-note">
      These are photographs I have taken over the years that I am proud of.<br>
      Some are technically good, some are compositionally good,<br>
      and some are only sentimentally good.<br>
      <br>
      All of them are good to me.
    </p>
    <div class="photo-wall" id="photo-wall"></div>
  </div>

  <img
    class="photo-signature"
    src="../assets/signature.png?v=2"
    alt="Navarre"
  >

  <div class="photo-footer">
    <a class="back-btn stub-back" href="#top">↑ Top</a>
  </div>

  <dialog id="photo-dialog" class="photo-dialog" aria-labelledby="photo-dialog-caption">
    <div class="photo-dialog-stage">
      <div class="photo-dialog-top">
        <p id="photo-dialog-count" class="photo-dialog-count" aria-live="polite"></p>
        <button type="button" class="photo-dialog-close" aria-label="Close">×</button>
      </div>
      <div class="photo-dialog-frame">
        <button type="button" class="photo-dialog-nav photo-dialog-prev" aria-label="Previous photograph">‹</button>
        <img class="photo-dialog-img" alt="">
        <button type="button" class="photo-dialog-nav photo-dialog-next" aria-label="Next photograph">›</button>
      </div>
      <p id="photo-dialog-caption" class="photo-dialog-caption"></p>
    </div>
  </dialog>

  <script>
        const photos = [
      "../images/photography/marekStudy.jpg",
      "../images/photography/greenRiver01.jpg",
      "../images/photography/alyssaWhiteShirt.jpg",
      "../images/photography/salsaHabanero.jpg",
      "../images/photography/idyllsEndLosOsos.jpg",
      "../images/photography/USUOldMain.jpg",
      "../images/photography/gramaBabyBlackDragon.jpg",
      "../images/photography/porterPilot.jpg",
      "../images/photography/marekFuzzyHat.jpg",
      "../images/photography/peruvianTestDish.jpg",
      "../images/photography/vineyardGodRays.jpg",
      "../images/photography/thanksgivingRenaissance.jpg",
      "../images/photography/2021Marek.jpg",
      "../images/photography/boysFight01.jpg",
      "../images/photography/rFamilyPic.jpg",
      "../images/photography/catalinaSunset.jpg",
      "../images/photography/lakeLaughs.png",
      "../images/photography/springvilleMountains.jpg",
      "../images/photography/coffeCake.jpg",
      "../images/photography/cacheStairs.JPG",
      "../images/photography/jacen.jpg",
      "../images/photography/boyLake.jpg",
      "../images/photography/boyTux.jpg",
      "../images/photography/bakcOfTimp.JPG",
      "../images/photography/skullTree.JPG",
      "../images/photography/gramaBaby.JPG",
      "../images/photography/robinHoodMeal.jpg",
      "../images/photography/mistedMountains.JPG",
      "../images/photography/bAndM.jpg",
      "../images/photography/elleVector.jpg",
      "../images/photography/marlinGreenRiver.jpg",
      "../images/photography/2014Marek.jpg",
      "../images/photography/johyevening.jpg",
      "../images/photography/potatoSalad.jpg",
      "../images/photography/portrait_green_018859.jpg",
      "../images/photography/hawaiiSunrise.jpg",
      "../images/photography/silver_deer_bokeh.jpg",
      "../images/photography/donPorterUtahLake.jpg",
      "../images/photography/porterShields.jpg",
      "../images/photography/chileVerde.jpg",
      "../images/photography/marekShields.jpg",
      "../images/photography/2019FallPics.jpg",
      "../images/photography/2020FallPics.jpg",
      "../images/photography/2021FallPics.jpg",
      "../images/photography/eggs.jpg",
    ];

    const captions = {
      "marekStudy.jpg": "Studying",
      "greenRiver01.jpg": "Green River",
      "alyssaWhiteShirt.jpg": "In a white shirt",
      "salsaHabanero.jpg": "Habanero salsa",
      "idyllsEndLosOsos.jpg": "Idyll's End in Los Osos",
      "USUOldMain.jpg": "Utah State University Old Main",
      "gramaBabyBlackDragon.jpg": "Grandma and a baby with a black dragon",
      "porterPilot.jpg": "Dressed as a pilot",
      "marekFuzzyHat.jpg": "In a fuzzy hat",
      "peruvianTestDish.jpg": "A Peruvian test dish",
      "vineyardGodRays.jpg": "God rays over a vineyard",
      "thanksgivingRenaissance.jpg": "Thanksgiving, renaissance style",
      "2021Marek.jpg": "In 2021",
      "boysFight01.jpg": "Boys play-fighting",
      "rFamilyPic.jpg": "Family picture",
      "catalinaSunset.jpg": "Sunset at Catalina",
      "lakeLaughs.png": "Laughing at the lake",
      "springvilleMountains.jpg": "Mountains above Springville",
      "coffeCake.jpg": "Coffee cake",
      "cacheStairs.JPG": "Stairs in Cache Valley",
      "jacen.jpg": "A boxer",
      "boyLake.jpg": "At the Lake",
      "boyTux.jpg": "In a tuxedo",
      "bakcOfTimp.JPG": "The back side of Mount Timpanogos",
      "skullTree.JPG": "A skull in a tree",
      "gramaBaby.JPG": "Great Grandma meets her great grandson",
      "robinHoodMeal.jpg": "A Robin Hood meal",
      "mistedMountains.JPG": "Misted mountains",
      "bAndM.jpg": "Grandma and grandson",
      "elleVector.jpg": "Americana at the range",
      "marlinGreenRiver.jpg": "On the Green River",
      "2014Marek.jpg": "In 2014",
      "johyevening.jpg": "Equestrian statues at dusk",
      "potatoSalad.jpg": "Potato salad",
      "portrait_green_018859.jpg": "Portrait at Dusk",
      "hawaiiSunrise.jpg": "Sunrise in Hawaii",
      "silver_deer_bokeh.jpg": "A silver deer in soft focus",
      "donPorterUtahLake.jpg": "At Utah Lake",
      "porterShields.jpg": "With shields",
      "chileVerde.jpg": "Chile verde",
      "marekShields.jpg": "Hero Posing",
      "2019FallPics.jpg": "Fall pictures, 2019",
      "2020FallPics.jpg": "Fall pictures, 2020",
      "2021FallPics.jpg": "Fall pictures, 2021",
      "eggs.jpg": "Eggs"
    };

    function captionFor(src) {
      const name = src.split("/").pop();
      if (captions[name]) return captions[name];
      const stem = name
        .replace(/\.[^.]+$/, "")
        .replace(/[_-]?\d{5,}/g, "")
        .replace(/([a-z])([A-Z])/g, "$1 $2")
        .replace(/[_-]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();
      return stem.charAt(0).toUpperCase() + stem.slice(1);
    }

    const wall = document.getElementById("photo-wall");
    const dialog = document.getElementById("photo-dialog");
    const dialogImg = dialog.querySelector(".photo-dialog-img");
    const captionEl = document.getElementById("photo-dialog-caption");
    const countEl = document.getElementById("photo-dialog-count");
    let current = 0;
    let opener = null;

    const photoDisplay = new Set([
      "chileVerde.jpg",
      "eggs.jpg",
      "peruvianTestDish.jpg",
      "potatoSalad.jpg",
      "robinHoodMeal.jpg",
      "salsaHabanero.jpg",
      "2019FallPics.jpg",
    ]);

    // Display images that also ship AVIF and an 800w variant (stem-800.ext).
    const photoResponsive = new Set([
      "2019FallPics.jpg",
    ]);
    // Tiles are square crops (object-fit: cover) of 3:2 photos, so the
    // rendered image is ~1.5x the tile width: 4 / 2 / 1 columns.
    const tileSizes = "(max-width: 520px) 150vw, (max-width: 900px) 75vw, 37.5vw";

    function lightboxSrc(src) {
      const name = src.split("/").pop();
      return photoResponsive.has(name)
        ? src.replace(/[^/]+$/, "display/" + name)
        : src;
    }

    photos.forEach((src, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      const name = src.split("/").pop();
      const caption = captionFor(src);
      const img = document.createElement("img");
      img.alt = caption;
      img.loading = "lazy";
      btn.setAttribute("aria-label", "View photograph: " + caption);
      if (photoDisplay.has(name)) {
        const stem = name.replace(/\.[^.]+$/, "");
        const base = src.replace(/[^/]+$/, "display/" + stem);
        const picture = document.createElement("picture");
        if (photoResponsive.has(name)) {
          for (const [type, ext] of [["image/avif", "avif"], ["image/webp", "webp"]]) {
            const source = document.createElement("source");
            source.type = type;
            source.srcset = `${base}-800.${ext} 800w, ${base}.${ext} 1600w`;
            source.sizes = tileSizes;
            picture.append(source);
          }
          img.srcset = `${base}-800.jpg 800w, ${base}.jpg 1600w`;
          img.sizes = tileSizes;
          img.width = 1600;
          img.height = 1067;
        } else {
          const source = document.createElement("source");
          source.type = "image/webp";
          source.srcset = base + ".webp";
          picture.append(source);
        }
        img.src = base + ".jpg";
        picture.append(img);
        btn.appendChild(picture);
      } else {
        img.src = src;
        btn.appendChild(img);
      }
      btn.addEventListener("click", () => openLightbox(i, btn));
      wall.appendChild(btn);
    });

    function show(index) {
      current = (index + photos.length) % photos.length;
      const caption = captionFor(photos[current]);
      dialogImg.src = lightboxSrc(photos[current]);
      dialogImg.alt = caption;
      captionEl.textContent = caption;
      countEl.textContent = (current + 1) + " of " + photos.length;
    }

    function openLightbox(index, btn) {
      opener = btn || document.activeElement;
      show(index);
      if (!dialog.open) dialog.showModal();
    }

    dialog.querySelector(".photo-dialog-close").addEventListener("click", () => dialog.close());
    dialog.querySelector(".photo-dialog-next").addEventListener("click", () => show(current + 1));
    dialog.querySelector(".photo-dialog-prev").addEventListener("click", () => show(current - 1));
    dialog.addEventListener("click", (event) => {
      const el = event.target && event.target.closest ? event.target : event.target.parentElement;
      if (el && el.closest("button, img, .photo-dialog-caption, .photo-dialog-count")) return;
      dialog.close();
    });
    dialog.addEventListener("close", () => {
      dialogImg.removeAttribute("src");
      if (opener && opener.focus) opener.focus();
    });
    dialog.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight") {
        event.preventDefault();
        show(current + 1);
      } else if (event.key === "ArrowLeft") {
        event.preventDefault();
        show(current - 1);
      }
    });
    let touchX = 0;
    let touchY = 0;
    dialog.addEventListener("touchstart", (event) => {
      if (event.touches.length !== 1) return;
      touchX = event.touches[0].clientX;
      touchY = event.touches[0].clientY;
    }, { passive: true });
    dialog.addEventListener("touchend", (event) => {
      const touch = event.changedTouches[0];
      const dx = touch.clientX - touchX;
      const dy = touch.clientY - touchY;
      if (Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(dy)) return;
      show(current + (dx < 0 ? 1 : -1));
    }, { passive: true });
  </script>

  <script src="../js/page-enter.js"></script>
  <footer class="legal-footer" style="text-align:center;font-size:0.75rem;line-height:1.5;opacity:0.75;padding:1.5rem 1rem 2rem;margin:0;"><a href="/privacy">Privacy</a> · <a href="/copyright">Copyright</a></footer>
</body>
</html>
