<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Campaign reference</title>
  <link rel="stylesheet" href="reference.css">
</head>
<body>
  <main class="reference">
    <h1>Campaign reference</h1>

    <section aria-labelledby="maps-heading">
      <h2 id="maps-heading">Maps</h2>
      <ul class="party">
        <li>
          <a href="timberfell-reach/">
            <img src="maps/timberfell-reach-thumb.jpg" alt="" width="720" height="720">
            <span>Map - Timberfell Reach</span>
          </a>
        </li>
      </ul>
    </section>

    <section aria-labelledby="characters-heading">
      <h2 id="characters-heading">Characters</h2>
      <ul class="party">
        <li>
          <a href="sheets/keiltheghome.pdf" target="_blank" rel="noopener noreferrer">
            <img src="characters/keiltheghome.jpg" alt="" width="760" height="760">
            <span>Keiltheghome</span>
          </a>
        </li>
        <li>
          <a href="sheets/erkun.pdf" target="_blank" rel="noopener noreferrer">
            <img src="characters/erkun.jpg" alt="" width="1031" height="1031">
            <span>Erkun</span>
          </a>
        </li>
        <li>
          <a href="sheets/mary.pdf" target="_blank" rel="noopener noreferrer">
            <img src="characters/mary.jpg" alt="" width="924" height="924">
            <span>Mary</span>
          </a>
        </li>
        <li>
          <a href="sheets/delphine.pdf" target="_blank" rel="noopener noreferrer">
            <img src="characters/delphine.jpg" alt="" width="974" height="974">
            <span>Delphine</span>
          </a>
        </li>
      </ul>
    </section>

    <section aria-labelledby="npcs-heading">
      <h2 id="npcs-heading">NPC's</h2>
      <ul class="party">
        <li>
          <button type="button" class="portrait" data-full="npcs/alden-crowe.jpg" data-title="Guard Captain Alden Crowe">
            <img src="npcs/alden-crowe-thumb.jpg" alt="" width="498" height="498">
            <span>Guard Captain Alden Crowe</span>
          </button>
        </li>
        <li>
          <button type="button" class="portrait" data-full="npcs/noctivagus-vargul.jpg" data-title="Noctivagus Var'gul">
            <img src="npcs/noctivagus-vargul-thumb.jpg" alt="" width="644" height="644">
            <span>Noctivagus Var'gul</span>
          </button>
        </li>
      </ul>
    </section>

    <section aria-labelledby="references-heading">
      <h2 id="references-heading">References</h2>
      <ul>
        <li><a href="https://watabou.github.io/index.html" target="_blank" rel="noopener noreferrer">Watabou</a></li>
        <li><a href="https://tobis-tales.com/en/" target="_blank" rel="noopener noreferrer">Tobi's Tales</a></li>
      </ul>
    </section>
  </main>

  <div id="portrait-lightbox" class="portrait-lightbox" hidden>
    <div class="portrait-lightbox-sheet">
      <div class="portrait-lightbox-bar">
        <p id="portrait-lightbox-title" class="portrait-lightbox-title"></p>
        <button type="button" class="portrait-lightbox-close">Close</button>
      </div>
      <img id="portrait-lightbox-image" alt="">
    </div>
  </div>
  <script src="reference.js"></script>
</body>
</html>
