<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Map - Timberfell Reach</title>
  <link rel="stylesheet" href="../reference.css">
</head>
<body>
  <main class="map-page">
    <p class="map-back"><a href="../">Campaign reference</a></p>
    <h1>Timberfell Reach</h1>

    <div class="map-stage">
      <img src="../maps/timberfell-reach.jpg" alt="Region map of Timberfell Reach" width="2400" height="2400">

      <button type="button" class="hotspot" style="left:12.167%;top:23.458%;width:7.958%;height:1.875%" data-map="../maps/wardholm.jpg" data-title="Wardholm" aria-label="Wardholm"></button>
      <button type="button" class="hotspot" style="left:10.083%;top:40.667%;width:6.792%;height:1.917%" data-map="../maps/deepwood.jpg" data-title="Deepwood" aria-label="Deepwood"></button>
      <button type="button" class="hotspot" style="left:19.750%;top:34.958%;width:7.667%;height:1.542%" data-map="../maps/sisters-rest.jpg" data-title="Sister's Rest" aria-label="Sister's Rest"></button>
      <button type="button" class="hotspot" style="left:61.083%;top:22.458%;width:4.833%;height:1.833%" data-map="../maps/adara.jpg" data-title="Adara" aria-label="Adara"></button>
      <button type="button" class="hotspot" style="left:68.333%;top:31.042%;width:3.208%;height:1.542%" data-map="../maps/gort.jpg" data-title="Gort" aria-label="Gort"></button>
      <button type="button" class="hotspot" style="left:56.375%;top:34.583%;width:6.500%;height:1.875%" data-map="../maps/mullagh.jpg" data-title="Mullagh" aria-label="Mullagh"></button>
      <button type="button" class="hotspot" style="left:62.333%;top:45.208%;width:9.375%;height:2.083%" data-map="../maps/silverfield.jpg" data-title="Silverfield" aria-label="Silverfield"></button>

      <button type="button" class="hotspot" style="left:86.875%;top:64.375%;width:7.125%;height:2.083%" data-map="../maps/skymill.jpg" data-title="Skymill" aria-label="Skymill"></button>
      <button type="button" class="hotspot" style="left:65.542%;top:70.250%;width:7.042%;height:1.833%" data-map="../maps/kinbrace.jpg" data-title="Kinbrace" aria-label="Kinbrace"></button>
      <button type="button" class="hotspot" style="left:41.708%;top:82.625%;width:5.667%;height:3.750%" data-map="../maps/abbots-cove.jpg" data-title="Abbots Cove" aria-label="Abbots Cove"></button>
    </div>
  </main>

  <div id="lightbox" class="lightbox" hidden>
    <div class="lightbox-sheet">
      <div class="lightbox-bar">
        <p id="lightbox-title" class="lightbox-title"></p>
        <button type="button" class="lightbox-close">Close</button>
      </div>
      <img id="lightbox-image" alt="">
    </div>
  </div>

  <script src="map.js"></script>
</body>
</html>
